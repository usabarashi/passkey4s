name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Neither of these is a DeterminateSystems tool (Q22): install-nix-action
      # is a Cachix-published installer with no account/service required, and
      # cache-nix-action just wraps GitHub's own actions/cache around the Nix
      # store. Magic Nix Cache was rejected as effectively paid/deprecated.
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # Coursier's own download cache lives outside the Nix store (Mill's
      # bootstrap manages it directly, see .mill-jvm-version), so it needs a
      # separate cache key or every run refetches the Scala/Scala.js/Tyrian
      # jars from scratch.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('build.mill') }}
          restore-keys: coursier-

      - name: Run tests
        run: nix develop --command mill webauthn.test

      - name: Build reproducible artifacts
        run: nix build

  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('build.mill') }}
          restore-keys: coursier-

      # wrangler deploy needs network access, so it cannot run inside `nix
      # build`'s sandbox (that's only permitted for the fixed-output
      # derivation above, which pins the result instead of trusting the
      # network). Rebuild the same, now-verified-reproducible artifacts
      # inside the ordinary devShell, where network is unrestricted, then
      # deploy them. Mill must run from the repo root (where build.mill
      # lives); wrangler resolves wrangler.toml's relative paths against the
      # config file's own directory regardless of cwd, so -c works from here.
      - name: Build worker and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          nix develop --command mill worker.assets
          nix develop --command mill worker.fullLinkJS
          nix develop --command wrangler deploy -c worker/wrangler.toml --env production
